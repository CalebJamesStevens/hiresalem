version: "3.9"

services:
  web:
    build:
      # Coolify runs compose with --project-directory set to the repo root.
      # Using "." keeps the build context anchored to the checked-out repo.
      context: .
      dockerfile: docker/Dockerfile
    command: sh -c "bun run db:migrate && bun run --cwd apps/web start"
    expose:
      - "3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@db:5432/hiresalem}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    expose:
      - "5432"
    environment:
      POSTGRES_DB: hiresalem
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hiresalem"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
