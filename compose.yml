version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    expose:
      - "3000"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/hiresalem
    depends_on:
      - db

  db:
    image: postgres:16
    expose:
      - "5432"
    environment:
      POSTGRES_DB: hiresalem
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
